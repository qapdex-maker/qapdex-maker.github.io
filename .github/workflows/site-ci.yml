name: Site CI

# Datei umbenannt von macrohard.yml: sie testet nicht mehr nur macrohard.
#
# Der alte Workflow-Name war "Macrohard CI" mit paths: macrohard/**. Das hat zwei
# Luecken erzeugt, im Audit am 2026-09-27 gefunden:
#
#   1. Er rief `node tests/app.test.js` — 68 von 298 Tests. Die restlichen 230
#      sind nie in der Pipeline gelaufen.
#   2. Er trigguerte nur auf macrohard/**. Alle msgraph-Commits sind ohne CI
#      durchgegangen, darunter 11 an einem Tag.
#
# Der Deploy-Job bleibt unveraendert: `path: '.'` laedt das ganze Repo hoch,
# und das ist fuer ein Pages-Repo mit mehreren Seiten richtig.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Ohne diesen Schritt fehlen node_modules UND alles darin. Neun Test-
      # dateien importieren espree direkt; es ist eine transitive Dependency von
      # eslint und war deshalb lokal vorhanden, aber nie deklariert. Der erste
      # Lauf dieser CI starb genau daran, 19 Sekunden nach dem Push.
      - name: Dependencies
        run: |
          cd macrohard
          npm install --no-audit --no-fund
          node -e "require('espree'); console.log('✅ espree auflösbar')"

      - name: macrohard — Syntax
        run: |
          cd macrohard
          node --check assets/app.js
          echo "✅ app.js syntax OK"

      - name: macrohard — Lint (0 Fehler erlaubt, Warnungen gemeldet)
        run: |
          cd macrohard
          npx eslint assets/app.js || echo "⚠️  eslint nicht verfügbar — übersprungen"

      - name: macrohard — volle Testsuite
        run: |
          cd macrohard
          npm test

      - name: jsmol — Syntax, Referenzen, i18n, Budget
        run: |
          node --test tests/jsmol-pages.test.mjs
          echo "✅ jsmol-Seiten geprüft"

      - name: macrohard — sw.js und manifest.json
        run: |
          cd macrohard
          test -f sw.js && echo "✅ sw.js present"
          test -f manifest.json && echo "✅ manifest.json present"

      - name: msgraph/react — Kompilat ist aktuell
        # app.js ist ein vorkompiliertes Kompilat von app.jsx. Ohne diesen
        # Schritt kann ein Quelltext-Fix committed werden, waehrend der Browser
        # weiter das alte Kompilat laedt — und alle Quelltext-Tests sind gruen.
        run: |
          cd msgraph/react
          sh build_appjs.sh
          if git diff --quiet -- assets/app.js; then
            echo "✅ app.js stimmt mit app.jsx überein"
          else
            echo "❌ assets/app.js weicht von app.jsx ab — sh build_appjs.sh fehlt"
            git --no-pager diff --stat -- assets/app.js
            exit 1
          fi

      # Die msgraph-Tests lesen die CSDL-Dateien aus metadata-msgraph/schemas —
      # ein anderes Repository, 50 MB, 23 Dateien. Ohne dieses Klonen schlagen
      # die Tests mit "metadata-msgraph not found" fehl, und die Pruefungen, die
      # den Join gegen echte Daten messen, laufen nie.
      - name: metadata-msgraph fuer die Skizzen-Tests
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/qapdex-maker/metadata-msgraph.git \
            "$HOME/github/repo/metadata-msgraph"
          cd "$HOME/github/repo/metadata-msgraph"
          git sparse-checkout set schemas
          ls schemas/*.csdl | wc -l | sed 's/^/  CSDL-Dateien: /'

      - name: msgraph/react — Tests
        run: |
          cd msgraph/react
          node --test tests/*.test.mjs

      - name: Gate — deploy-hygiene
        # Lief bisher nur lokal. Ein Gate, das man nicht automatisch laufen
        # lässt, wird übersprungen — genau dann, wenn es gebraucht wird.
        run: node deploy-hygiene.js

      - name: Gate-Tests
        run: node --test tests/deploy-hygiene-gate.test.mjs

      - name: Doku gegen Repository pruefen
        # Jede Zahl in der README ist eine Behauptung. Diese vergleicht sie mit
        # den echten Dateien — inklusive der Zusicherung, dass dieser Workflow
        # das tut, was die README ueber ihn behauptet.
        run: bash scripts/check-docs.sh

  deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
