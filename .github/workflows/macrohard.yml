name: Macrohard CI

on:
  push:
    branches: [main]
    paths:
      - 'macrohard/**'
  pull_request:
    branches: [main]
    paths:
      - 'macrohard/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Syntax Check app.js
        run: |
          cd macrohard
          node --check assets/app.js
          echo "✅ app.js syntax OK"
          
      - name: Run Tests
        run: |
          cd macrohard
          node tests/app.test.js
          
      - name: Verify sw.js exists
        run: |
          cd macrohard
          test -f sw.js && echo "✅ sw.js present"
          
      - name: Verify manifest.json
        run: |
          cd macrohard
          test -f manifest.json && echo "✅ manifest.json present"

  deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
