<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-de="JSmol Workbench" data-en="JSmol Workbench">JSmol Workbench</title>
<style>
  :root{
    --kobalt:#2547ff; --gelb:#ffd400; --paper:#f1ede3; --ink:#141414;
    --line:#141414; --ok:#1a7f37; --err:#c1121f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    min-height:100vh;
  }
  header{
    border-bottom:3px solid var(--line); padding:14px 16px;
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    background:var(--kobalt); color:#fff;
  }
  header h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.02em}
  header .sub{font-size:12px;opacity:.85;font-family:"IBM Plex Mono",monospace}
  header a.back{
    color:#fff; text-decoration:none; font-size:12px;
    border:2px solid #fff; padding:3px 9px; border-radius:2px;
  }
  main{
    display:grid; grid-template-columns:minmax(220px, 280px) 1fr; gap:0;
    align-items:stretch;
    /* Feste Hoehe statt min-height: nur so bekommt die Aside einen echten
       Scrollbereich. Mit min-height wächst das Grid mit dem Inhalt und
       overflow:auto haette nichts zum Scrollen. */
    height:calc(100vh - 58px - 44px);   /* -header -footer */
  }
  @media (max-width:820px){
    main{grid-template-columns:1fr; height:auto}
  }

  aside{
    border-right:3px solid var(--line); padding:14px;
    background:#e8e2d5;
    /* min-width:0 erlaubt dem Grid-Item zu schrumpfen. Ohne das wird die
       Aside 2640 px breit (gemessen am 2026-10-02 bei 412 px Viewport),
       weil das Flex-Kind die Breite der Inhalte erzwingt.
       width:100% waere hier falsch: zusammen mit padding ergibt das mehr
       als 100% (514 statt 412 gemessen) und die Seite bekommt einen
       horizontalen Scrollbalken. */
    min-width:0;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    max-height:100%;
  }
  @media (max-width:820px){
    aside{
      border-right:none; border-bottom:3px solid var(--line);
      max-height:none; overflow:visible;
      padding:10px 12px;
    }
    /* Eine Zeile, horizontal scrollbar. 19 Knöpfe sind keine Seite.
       Zwei Details, ohne die es 2640 px breit wird (gemessen am
       2026-10-02 statt der erwarteten 412):
         - width:100% der Basisregel muss hier weg. In einer Flex-Zeile
           bedeutet 100% "so breit wie der Container", nicht "so breit wie
           der Inhalt" — der Container waechst mit jedem Knopf mit.
         - width:100% auf dem aside selbst begrenzt die Breite auf das
           Grid-Feld, damit die Flex-Zeile nicht aus dem Bild laeuft.
    */
    #structureList{
      display:flex; gap:6px; overflow-x:auto; padding-bottom:6px;
      scroll-snap-type:x proximity;
      /* min-width:0 wie bei aside: sonst erzwingen die 19 li die Breite. */
      min-width:0; max-width:100%;
    }
    #structureList li{flex:0 0 auto; scroll-snap-align:start; margin-bottom:0}
    #structureList button{
      width:auto; min-width:132px; max-width:190px;
    }
  }

  aside h2{
    font-size:12px; text-transform:uppercase; letter-spacing:.08em;
    margin:0 0 10px; font-family:"IBM Plex Mono",monospace;
    position:sticky; top:-14px; background:#e8e2d5; padding:2px 0;
    z-index:2;
  }
  @media (max-width:820px){ aside h2{position:static; top:auto} }
  #structureList{list-style:none;margin:0;padding:0}
  #structureList li{margin-bottom:6px}
  #structureList li.empty{
    font-size:12px; font-style:italic; opacity:.7; padding:6px 2px;
  }

  /* Filter-Chips: die Liste hat 19 Eintraege in vier Gruppen, das ist eine
     Auswahlfrage und keine reine Blätterfrage. */
  .chips{display:flex; flex-wrap:wrap; gap:5px; margin:0 0 8px}
  .chips button{
    cursor:pointer; font:inherit; font-size:11px; line-height:1.4;
    background:#fff; border:2px solid var(--line); border-radius:999px;
    padding:2px 9px; color:var(--ink);
    font-family:"IBM Plex Mono",monospace;
  }
  .chips button:hover{background:var(--gelb)}
  .chips button.on{background:var(--kobalt); color:#fff; border-color:var(--kobalt)}
  .count{
    margin:0 0 8px; font-size:11px; opacity:.7;
    font-family:"IBM Plex Mono",monospace;
  }
  #structureList button{
    width:100%; text-align:left; cursor:pointer;
    background:#fff; border:2px solid var(--line); border-radius:2px;
    padding:8px 10px; font:inherit; font-size:13px; color:var(--ink);
  }
  #structureList button:hover{background:var(--gelb)}
  #structureList button[aria-current="true"]{
    background:var(--kobalt); color:#fff; border-color:var(--kobalt);
  }
  #structureList button .meta{
    display:block; font-size:11px; opacity:.75;
    font-family:"IBM Plex Mono",monospace;
  }

  section.work{padding:14px; display:flex; flex-direction:column; gap:12px}
  .toolbar{
    display:flex; gap:6px; flex-wrap:wrap; align-items:center;
    border:3px solid var(--line); background:#fff; padding:8px;
    border-radius:2px;
  }
  .toolbar button{
    cursor:pointer; background:var(--paper); border:2px solid var(--line);
    border-radius:2px; padding:5px 10px; font:inherit; font-size:13px;
  }
  .toolbar button:hover{background:var(--gelb)}
  .toolbar .sp{flex:1}
  .status{
    border:3px solid var(--line); border-left-width:10px;
    background:#fff; padding:8px 12px; font-size:13px;
    font-family:"IBM Plex Mono",monospace; min-height:38px;
  }
  .status.ok{border-left-color:var(--ok)}
  .status.err{border-left-color:var(--err)}
  .status.busy{border-left-color:var(--gelb)}
  #viewerWrap{
    border:3px solid var(--line); background:#fff; position:relative;
    min-height:320px; display:flex; align-items:center; justify-content:center;
  }
  #viewerWrap.j2d canvas{max-width:100%;height:auto;display:block}
  footer{
    border-top:3px solid var(--line); padding:10px 16px;
    font-size:11px; font-family:"IBM Plex Mono",monospace;
    display:flex; gap:14px; flex-wrap:wrap; background:#e8e2d5;
  }
  footer a{color:var(--kobalt)}
</style>
</head>
<body>

<header>
  <a class="back" href="../index.html">&larr; <span data-de="Portal" data-en="Portal">Portal</span></a>
  <h1>JSmol Workbench</h1>
  <span class="sub" data-de="Molekül-Viewer · Jmol 16.3.53 (j2s-Kern)" data-en="Molecule viewer · Jmol 16.3.53 (j2s core)">Molekül-Viewer · Jmol 16.3.53 (j2s-Kern)</span>
</header>

<main>
  <aside>
    <h2 data-de="Strukturen" data-en="Structures">Strukturen</h2>
    <div id="chips" class="chips" role="group" aria-label="Strukturgruppen"></div>
    <p class="count" id="count"></p>
    <ul id="structureList"></ul>
  </aside>

  <section class="work">
    <div class="toolbar">
      <button data-cmd="zoom reset"   data-de="Größe"      data-en="Reset view">Größe</button>
      <button data-cmd="zoom in"      data-de="Vergrößern" data-en="Zoom in">Vergrößern</button>
      <button data-cmd="zoom out"     data-de="Verkleinern" data-en="Zoom out">Verkleinern</button>
      <button data-cmd="spin on"     data-de="Drehen an"  data-en="Spin on">Drehen an</button>
      <button data-cmd="spin off"    data-de="Drehen aus" data-en="Spin off">Drehen aus</button>
      <button data-cmd="cartoon on"  data-de="Bänder"     data-en="Cartoon">Bänder</button>
      <button data-cmd="cartoon off" data-de="Kugeln"     data-en="Spacefill">Kugeln</button>
      <button data-cmd="select all"  data-de="Alles selektieren" data-en="Select all">Alles selektieren</button>
      <button data-cmd="wireframe off" data-de="Volumen aus" data-en="Hide surface">Volumen aus</button>
      <span class="sp"></span>
      <button id="langBtn" title="Sprache wechseln">DE / EN</button>
    </div>

    <div class="status busy" id="status" role="status" aria-live="polite">…</div>

    <div id="viewerWrap">
      <span id="mydiv"></span>
    </div>
  </section>
</main>

<footer>
  <span id="verLine">Jmol —</span>
  <span data-de="Renderung ohne WebGL (2D-Fallback)" data-en="Rendering without WebGL (2D fallback)">Renderung ohne WebGL (2D-Fallback)</span>
  <a href="https://jmol.sourceforge.net" rel="noopener">jmol.sourceforge.net</a>
  <span data-de="Lizenz: JSmol/Jmol (LGPL 2.1 / MIT)" data-en="License: JSmol/Jmol (LGPL 2.1 / MIT)">Lizenz: JSmol/Jmol (LGPL 2.1 / MIT)</span>
</footer>

<script src="JSmol.min.js"></script>
<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------- Daten
  // 19 Strukturen in vier Gruppen. Die Liste waechst mit dem Datenbestand,
  // darum Filter-Chips statt eines weiteren Scroll-Kragens.
  // Jede Datei ist lokal vorhanden — deploy-hygiene.js prueft das im Gate.
  var GROUPS = {
    protein: { de: 'Protein',    en: 'Protein' },
    organic: { de: 'Organisch',  en: 'Organic' },
    mineral: { de: 'Mineral',    en: 'Mineral' },
    novelty: { de: 'Exotic',     en: 'Exotic' }
  };

  var STRUCTURES = [
    // --- Protein
    { f:'data/1crn.pdb',       g:'protein', de:'Crambin (1CRN)',      en:'Crambin (1CRN)',      x:'1crn.pdb' },
    { f:'data/1cbs.cif',       g:'protein', de:'Calmodulin-Fragment', en:'Calmodulin fragment', x:'156 KB' },
    { f:'data/1crntour.pdb',   g:'protein', de:'Crambin (Tunnelansicht)', en:'Crambin (tunnel view)', x:'1crntour.pdb' },
    { f:'data/dna.pse',        g:'protein', de:'DNA-Doppelhelix',     en:'DNA double helix',    x:'dna.pse' },
    { f:'data/1bna_surface.pse', g:'protein', de:'DNA-Oberfläche',   en:'DNA surface',         x:'1bna_surface.pse' },
    // --- Organisch
    { f:'data/taxol.mol',      g:'organic', de:'Taxol',               en:'Taxol',               x:'taxol.mol' },
    { f:'data/caffeine.mol',   g:'organic', de:'Koffein',             en:'Caffeine',            x:'caffeine.mol' },
    { f:'data/estron.cml',     g:'organic', de:'Estron',              en:'Estrone',             x:'estron.cml' },
    { f:'data/c6h6.smol',      g:'organic', de:'Benzol (ZSM-5)',     en:'Benzene (ZSM-5)',     x:'165 KB' },
    { f:'data/co2.smol',       g:'organic', de:'CO₂-Molekül',        en:'CO₂ molecule',        x:'co2.smol' },
    // --- Mineral
    { f:'data/diamond.cif',    g:'mineral', de:'Diamant',             en:'Diamond',             x:'diamond.cif' },
    { f:'data/quartz.cif',     g:'mineral', de:'Quarz',               en:'Quartz',              x:'quartz.cif' },
    { f:'data/calcite.cif',    g:'mineral', de:'Calcit',              en:'Calcite',             x:'calcite.cif' },
    { f:'data/chromium.cif',   g:'mineral', de:'Chrom (kubisch)',    en:'Chromium (cubic)',    x:'chromium.cif' },
    { f:'data/nacl.cif',       g:'mineral', de:'Kochsalz',            en:'Sodium chloride',     x:'nacl.cif' },
    { f:'data/04369a.cif',     g:'mineral', de:'Carnallit (K-Dual)',  en:'Carnallite',          x:'04369a.cif' },
    { f:'data/maleic.cif',     g:'mineral', de:'Maleinsäure',         en:'Maleic acid',         x:'maleic.cif' },
    // --- Exotic
    { f:'data/c60af.mol',      g:'novelty', de:'Fulleren C60',        en:'Fullerene C60',        x:'c60af.mol' },
    { f:'data/buckyball.mol',  g:'novelty', de:'Buckyball (2D)',      en:'Buckyball (2D)',      x:'buckyball.mol' }
  ];

  // ---------------------------------------------------------------- i18n
  var I18N = {
    loading:   { de: 'lade Kernel …',                 en: 'loading core …' },
    loadingS:  { de: 'lade ',                          en: 'loading ' },
    ready:     { de: 'bereit',                         en: 'ready' },
    failed:    { de: 'fehlgeschlagen: ',                en: 'failed: ' },
    notFound:  { de: 'Datei nicht gefunden',           en: 'file not found' },
    coreError: { de: 'J2S-Kern nicht gestartet',      en: 'J2S core did not start' }
  };

  var lang = 'de';
  var applet = null;
  var ready = false;
  var current = STRUCTURES[0];
  var filter = null;

  // ---------------------------------------------------------------- Status
  function status(msg, cls) {
    var el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + (cls || '');
  }

  function t(key) { return I18N[key][lang]; }

  // ---------------------------------------------------------------- Aufbau
  // Filter: null = alle Gruppen. Die Chips stehen ueber der Liste, damit die
  // 19 Eintraege nicht als eine ungebrochene Naehe durchlaufen.
  function buildChips() {
    var bar = document.getElementById('chips');
    bar.innerHTML = '';
    var keys = Object.keys(GROUPS);
    var make = function (key, label) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.textContent = label;
      b.setAttribute('aria-pressed', filter === key ? 'true' : 'false');
      if (filter === key) b.classList.add('on');
      b.addEventListener('click', function () {
        filter = key;
        buildChips();
        buildList();
      });
      bar.appendChild(b);
    };
    make(null, lang === 'de' ? 'Alle' : 'All');
    keys.forEach(function (k) { make(k, GROUPS[k][lang]); });
  }

  function buildList() {
    var ul = document.getElementById('structureList');
    ul.innerHTML = '';
    var shown = 0;

    STRUCTURES.forEach(function (s, i) {
      if (filter && s.g !== filter) return;
      shown++;
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-current', s === current ? 'true' : 'false');
      b.innerHTML = '<span>' + s[lang] + '</span>' +
                    '<span class="meta">' + GROUPS[s.g][lang] + ' · ' + s.x + '</span>';
      b.addEventListener('click', function () { loadStructure(i); });
      li.appendChild(b);
      ul.appendChild(li);
    });

    if (!shown) {
      var empty = document.createElement('li');
      empty.className = 'empty';
      empty.textContent = lang === 'de' ? 'Keine Struktur in dieser Gruppe'
                                      : 'No structure in this group';
      ul.appendChild(empty);
    }
    // Zaehler am Kopf: macht die Scrollbarkeit der Liste sichtbar und
    // beantwortet die Frage "wie viele gibt es" ohne Zaehlen.
    document.getElementById('count').textContent =
      lang === 'de' ? shown + ' von ' + STRUCTURES.length
                    : shown + ' of ' + STRUCTURES.length;
  }

  function applyI18n() {
    var nodes = document.querySelectorAll('[data-de]');
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      el.textContent = el.getAttribute('data-' + lang);
    }
    document.documentElement.lang = lang;
    buildChips();
    buildList();
  }

  // ---------------------------------------------------------------- JSmol
  function startApplet() {
    var info = {
      width: 480,
      height: 420,
      j2sPath: 'j2s',
      use: 'HTML5',
      debug: false,
      disableJ2SLoadMonitor: true,
      disableInitialConsole: true,
      addSelectionOptions: true,
      script: 'load ' + STRUCTURES[0].f
    };

    info.readyFunction = function () {
      ready = true;
      status(t('ready') + ' — ' + current[lang], 'ok');
      document.getElementById('viewerWrap').classList.add('j2d');
    };

    document.getElementById('mydiv').innerHTML =
      Jmol.getAppletHtml('jmolApplet0', info);
    applet = window.jmolApplet0;
    status(t('loading'), 'busy');

    // Sicherheitsnetz: wenn der Kern nach 20 s nicht steht, ist das ein
    // Fehler und kein "lädt noch". Sonst bleibt die Seite endlos bei "lade".
    setTimeout(function () {
      if (!ready) status(t('coreError'), 'err');
    }, 20000);
  }

  function loadStructure(i) {
    current = STRUCTURES[i];
    buildList();
    status(t('loadingS') + current[lang], 'busy');

    // VOR dem Befehl pruefen, ob die Datei ueberhaupt liegt: sonst gibt der
    // J2S-Kern eine leere Flaeche statt einer Meldung zurueck.
    //
    // Zwei Fehler, die dieser Vorcheck schon produziert hat und die beide
    // scheiterten, nicht der Kern:
    //  1. Ein <img>-Element ist der falsche Test. Ein Browser kann eine
    //     .pdb-Datei nicht dekodieren, also feuert onerror bei JEDER
    //     vorhandenen Strukturdatei. Gemessen: "data/caffeine.mol — Datei
    //     nicht gefunden" bei einer Datei, die im Repo liegt.
    //  2. Ein Query-String als Cache-Buster landet im Dateinamen. Der
    //     statische Server findet "caffeine.mol?probe=1" nicht.
    // Der ehrliche Test ist ein HEAD auf den exakten Pfad: 200 = vorhanden,
    // 404 = wirklich weg. Und er kostet keine Bytes Nutzlast.
    fetch(current.f, { method: 'HEAD' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        Jmol.script(applet, 'load ' + current.f + '; zoom reset');
        status(t('ready') + ' — ' + current[lang], 'ok');
      })
      .catch(function (e) {
        status(current.f + ' — ' + t('notFound') + ' (' + e.message + ')', 'err');
      });
  }

  function wireToolbar() {
    var btns = document.querySelectorAll('.toolbar button[data-cmd]');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function (e) {
        if (!ready) { status(t('loading'), 'busy'); return; }
        try {
          Jmol.script(applet, e.currentTarget.getAttribute('data-cmd'));
        } catch (err) { status(t('failed') + err.message, 'err'); }
      });
    }
    document.getElementById('langBtn').addEventListener('click', function () {
      lang = lang === 'de' ? 'en' : 'de';
      applyI18n();
      // Status neu setzen, sonst nennt er weiter den Strukturnamen in der
      // alten Sprache. loadStructure() liest current[lang] — der
      // Aufruf ist die einzige Stelle, die den Text korrekt neu baut.
      if (ready) loadStructure(STRUCTURES.indexOf(current));
      else status(t('loading'), 'busy');
    });
  }

  // ---------------------------------------------------------------- Start
  function boot() {
    try {
      document.getElementById('verLine').textContent =
        'Jmol ' + (Jmol.getVersion ? Jmol.getVersion() : '16.3.53');
    } catch (e) { /* Versionsanzeige ist optional */ }
    applyI18n();
    wireToolbar();
    startApplet();
  }

  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', boot);
  else
    boot();
})();
</script>
</body>
</html>
