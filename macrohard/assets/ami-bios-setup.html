<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AMIBIOS Setup Utility</title>
<style>
/* === AMIBIOS CRT Style — Pure CSS, no external deps === */
:root{
  --bg:#0a0a0a;
  --surface:#121414;
  --surface-low:#1a1c1c;
  --surface-high:#292a2a;
  --primary:#0edcdd;
  --primary-fixed:#4df9f9;
  --secondary:#e9e941;
  --secondary-fixed:#d8d82f;
  --error:#ffb4ab;
  --text:#e3e2e2;
  --text-dim:#bacac9;
  --ink:#0b0b0c;
  --accent:#2547ff;
  --accent-2:#ffd400;
  --line:#3b4949;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  background:var(--bg);
  color:var(--text);
  font-family:'Courier New',Courier,monospace;
  font-size:13px;
  line-height:1.4;
  height:100%;
  overflow:hidden;
}
/* CRT Effects */
.crt{
  position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0,rgba(0,0,0,.15) 1px,transparent 1px,transparent 3px);
  mix-blend-mode:multiply;
}
.crt-vignette{
  position:fixed;inset:0;pointer-events:none;z-index:9998;
  box-shadow:inset 0 0 100px rgba(0,0,0,.7);
}
.crt-flicker{
  animation:flicker 4s infinite;
}
@keyframes flicker{
  0%,100%{opacity:1}
  3%{opacity:.95}
  6%{opacity:1}
  7%{opacity:.92}
  9%{opacity:1}
  50%{opacity:.98}
}
.crt-glow{
  text-shadow:0 0 5px var(--primary),0 0 10px rgba(14,220,221,.3);
}
/* Boot Screen */
#boot-screen{
  position:fixed;inset:0;z-index:1000;
  background:#000;
  color:#aaa;
  font-size:12px;
  padding:20px;
  overflow:hidden;
  transition:opacity .6s;
}
#boot-screen .boot-line{
  margin:2px 0;
  white-space:pre;
}
#boot-screen .highlight{color:var(--primary)}
#boot-screen .ok{color:#0f0}
#boot-screen .mem{color:var(--secondary)}
/* Main BIOS Container */
#bios{
  display:flex;
  flex-direction:column;
  height:100%;
  overflow:hidden;
}
/* Header Tape */
.bios-header{
  background:var(--surface-high);
  border-bottom:3px solid var(--line);
  padding:6px 12px;
  display:flex;
  align-items:center;
  justify-content:between;
  gap:16px;
  flex-shrink:0;
}
.bios-header .logo{
  color:var(--primary);
  font-weight:bold;
  font-size:14px;
}
.bios-header .title{
  color:var(--secondary);
  font-weight:bold;
  letter-spacing:2px;
}
.bios-header .subtitle{
  color:var(--text-dim);
  font-size:10px;
  margin-left:auto;
}
.blink{
  animation:blink 1s infinite;
}
@keyframes blink{
  0%,49%{opacity:1}
  50%,100%{opacity:0}
}
/* Main Body */
.bios-body{
  flex:1;
  display:flex;
  overflow:hidden;
  min-height:0;
}
/* Sidebar */
.bios-sidebar{
  width:240px;
  background:var(--surface-low);
  border-right:3px solid var(--line);
  display:flex;
  flex-direction:column;
  overflow-y:auto;
  flex-shrink:0;
}
.bios-sidebar-title{
  padding:8px 12px;
  background:var(--surface-high);
  color:var(--primary);
  font-weight:bold;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
  border-bottom:2px solid var(--line);
}
.bios-menu-item{
  padding:6px 12px;
  cursor:pointer;
  border-left:3px solid transparent;
  transition:all .15s;
  font-size:12px;
}
.bios-menu-item:hover{
  background:var(--surface-high);
  border-left-color:var(--primary);
  color:var(--primary-fixed);
}
.bios-menu-item.active{
  background:var(--accent);
  color:#fff;
  border-left-color:var(--secondary);
  font-weight:bold;
}
.bios-menu-item .arrow{
  float:right;
  opacity:0;
}
.bios-menu-item.active .arrow{
  opacity:1;
}
/* Detail Panel */
.bios-detail{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.bios-detail-header{
  padding:8px 16px;
  background:var(--surface-high);
  color:var(--primary);
  font-weight:bold;
  border-bottom:2px solid var(--line);
  flex-shrink:0;
}
.bios-detail-body{
  flex:1;
  overflow-y:auto;
  padding:12px;
}
/* Form Fields */
.field-row{
  display:flex;
  align-items:center;
  padding:6px 8px;
  border-bottom:1px solid rgba(255,255,255,.05);
  gap:12px;
}
.field-row:hover{
  background:var(--surface-low);
}
.field-label{
  width:180px;
  flex-shrink:0;
  color:var(--text-dim);
  font-size:11px;
}
.field-value{
  flex:1;
  color:var(--primary-fixed);
  font-weight:bold;
  font-size:12px;
  background:var(--bg);
  padding:4px 8px;
  border:2px solid var(--line);
  outline:none;
  font-family:inherit;
}
.field-value:focus{
  border-color:var(--accent);
  box-shadow:0 0 6px var(--accent);
}
.field-value.select{
  cursor:pointer;
}
.field-value.readonly{
  color:var(--secondary);
  border-color:transparent;
  background:transparent;
}
/* Memory Bar */
.mem-bar-wrap{
  background:var(--bg);
  border:2px solid var(--line);
  height:16px;
  position:relative;
  overflow:hidden;
  flex:1;
}
.mem-bar-fill{
  height:100%;
  background:var(--secondary);
  transition:width .5s;
}
.mem-bar-label{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  color:#000;
  font-weight:bold;
}
/* Bottom Keys */
.bios-keys{
  background:var(--surface-high);
  border-top:3px solid var(--line);
  padding:4px 8px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  flex-shrink:0;
}
.bios-key{
  background:var(--bg);
  border:2px solid var(--line);
  padding:4px 8px;
  font-size:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-width:60px;
}
.bios-key .key-name{
  color:var(--primary);
  font-weight:bold;
  font-size:11px;
}
.bios-key .key-desc{
  color:var(--text-dim);
  font-size:9px;
}
/* Toast */
#toast-container{
  position:fixed;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  z-index:2000;
  display:flex;
  flex-direction:column;
  gap:4px;
  align-items:center;
  pointer-events:none;
}
.toast{
  background:var(--surface-high);
  border:2px solid var(--accent-2);
  color:var(--text);
  padding:6px 16px;
  font-size:11px;
  box-shadow:4px 4px 0 var(--ink);
  white-space:nowrap;
  opacity:0;
  transition:opacity .2s;
}
/* CRT Screen Curve */
.crt-curve{
  border-radius:4px;
  overflow:hidden;
}
/* Responsive */
@media(max-width:760px){
  .bios-sidebar{width:160px}
  .field-label{width:120px;font-size:10px}
}
</style>
</head>
<body class="crt-flicker">
<div class="crt"></div>
<div class="crt-vignette"></div>

<!-- Boot Screen -->
<div id="boot-screen"></div>

<!-- Main BIOS -->
<div id="bios" style="display:none">
  <div class="bios-header">
    <span class="logo">■ AMIBIOS</span>
    <span class="title">CMOS SETUP UTILITY</span>
    <span class="subtitle">American Megatrends Inc. <span class="blink">_</span></span>
  </div>
  <div class="bios-body">
    <div class="bios-sidebar">
      <div class="bios-sidebar-title">► Main Menu</div>
      <div id="menu-list"></div>
    </div>
    <div class="bios-detail">
      <div class="bios-detail-header" id="detail-header">╔════ STANDARD CMOS SETUP (AWARD) ════╗</div>
      <div class="bios-detail-body" id="detail-body"></div>
    </div>
  </div>
  <div class="bios-keys">
    <div class="bios-key"><span class="key-name">ESC</span><span class="key-desc">Quit</span></div>
    <div class="bios-key"><span class="key-name">↑↓←→</span><span class="key-desc">Navigate</span></div>
    <div class="bios-key"><span class="key-name">+/-</span><span class="key-desc">Modify</span></div>
    <div class="bios-key"><span class="key-name">Enter</span><span class="key-desc">Edit</span></div>
    <div class="bios-key"><span class="key-name">F5</span><span class="key-desc">Old Values</span></div>
    <div class="bios-key"><span class="key-name">F6</span><span class="key-desc">BIOS Def</span></div>
    <div class="bios-key"><span class="key-name">F7</span><span class="key-desc">Setup Def</span></div>
    <div class="bios-key"><span class="key-name">F10</span><span class="key-desc">Save &amp; Exit</span></div>
  </div>
</div>

<div id="toast-container"></div>

<script>
(function(){
  'use strict';

  // === State ===
  var state = {
    currentTab: 'standard-cmos',
    selectedItem: 0,
    modified: false,
    beepCtx: null,
    memTestDone: false,
    date: { h:14, m:32, s:8 },
    fields: {
      sysDate: new Date().toLocaleDateString('de-DE'),
      sysTime: '14:32:08',
      haltOn: { value:'All Errors', opts:['All Errors','No Errors','All But Keyboard','All But Diskette'] },
      video: { value:'EGA/VGA', opts:['EGA/VGA','CGA 40','CGA 80','Mono'] },
      floppyA: { value:'1.44M 3.5"', opts:['None','360K 5.25"','1.2M 5.25"','720K 3.5"','1.44M 3.5"','2.88M 3.5"'] },
      floppyB: { value:'None', opts:['None','360K 5.25"','1.2M 5.25"','720K 3.5"','1.44M 3.5"','2.88M 3.5"'] },
      bootSeq: { value:'A:,C:', opts:['A:,C:','C:,A:','C: Only','CD-ROM,C:,A:','LS-120,C:,A:'] },
      bootSeek: { value:'Enabled', opts:['Enabled','Disabled'] },
      swapFloppy: { value:'Disabled', opts:['Enabled','Disabled'] },
      numLock: { value:'On', opts:['On','Off'] },
      typematic: { value:'Enabled', opts:['Enabled','Disabled'] },
      password: { value:'None', opts:['None','Setup','Always'] },
      shadow: { value:'Enabled', opts:['Enabled','Disabled'] },
      cache: { value:'Enabled', opts:['Enabled','Disabled'] },
      turbo: { value:'Enabled', opts:['Enabled','Disabled'] },
      QuickPOST: { value:'Enabled', opts:['Enabled','Disabled'] },
      virusWarn: { value:'Enabled', opts:['Enabled','Disabled'] },
      bootOS2: { value:'No', opts:['Yes','No'] },
      cacheECC: { value:'Enabled', opts:['Enabled','Disabled'] },
      dramTiming: { value:'Auto', opts:['Auto','60ns','70ns'] },
      casLatency: { value:'3', opts:['2','3'] },
      sdrBanks: { value:'4', opts:['2','4'] },
      agpMode: { value:'4x', opts:['1x','2x','4x'] },
      acpiMode: { value:'Enabled', opts:['Enabled','Disabled'] },
      powerMode: { value:'User Define', opts:['User Define','Min Saving','Max Saving'] },
      standbyMin: { value:'Disabled', opts:['Disabled','1 Min','2 Min','4 Min','8 Min','12 Min','20 Min'] },
      resumeDate: { value:'0:00:00', opts:['0:00:00','1:00:00','Every Day'] },
      irq1: { value:'PCI/ISA PnP', opts:['PCI/ISA PnP','Legacy ISA'] },
      irq3: { value:'PCI/ISA PnP', opts:['PCI/ISA PnP','Legacy ISA','Available'] },
      dma1: { value:'PCI/ISA PnP', opts:['PCI/ISA PnP','Legacy ISA','Available'] },
      pnpOs: { value:'No', opts:['Yes','No'] },
      resetConfig: { value:'No', opts:['Yes','No'] },
      onboardIde: { value:'Both', opts:['Both','Primary Only','Secondary Only','Disabled'] },
      usbCtrl: { value:'Enabled', opts:['Enabled','Disabled'] },
      usbLegacy: { value:'Enabled', opts:['Enabled','Disabled'] },
      serial1: { value:'3F8/IRQ4', opts:['3F8/IRQ4','2F8/IRQ3','3E8/IRQ4','2E8/IRQ3','Auto','Disabled'] },
      serial2: { value:'2F8/IRQ3', opts:['3F8/IRQ4','2F8/IRQ3','3E8/IRQ4','2E8/IRQ3','Auto','Disabled'] },
      parallel: { value:'378/IRQ7', opts:['378/IRQ7','278/IRQ5','3BC/IRQ7','Disabled'] },
      audio: { value:'Auto', opts:['Auto','Disabled'] }
    }
  };

  var tabNames = {
    'standard-cmos': 'STANDARD CMOS SETUP',
    'bios-features': 'BIOS FEATURES SETUP',
    'chipset': 'CHIPSET FEATURES SETUP',
    'power-mgmt': 'POWER MANAGEMENT SETUP',
    'pnp-pci': 'PNP/PCI CONFIGURATION',
    'integrated': 'INTEGRATED PERIPHERALS',
    'hardware': 'HARDWARE MONITOR & MISC'
  };

  var tabItems = {
    'standard-cmos': ['Date / Time','Hard Disks','Floppy & Display','Boot Sequence','Memory Info','System Summary'],
    'bios-features': ['CPU Info','Quick POST','Boot Sequence','Boot Seek','NumLock','Typematic Rate','Password Check','Video Shadow','Cache ECC','Virus Warning','OS/2 Boot','Turbo Switch'],
    'chipset': ['DRAM Timing','CAS Latency','SDR Banks','AGP Mode','Spread Spectrum','Memory Hole'],
    'power-mgmt': ['ACPI Mode','Power Mode','Standby','Hibernate','Wake Events','AC Loss'],
    'pnp-pci': ['IRQ Allocation','DMA Channels','PnP OS','PCI Latency','Reset Config','PCI VGA Palette'],
    'integrated': ['Onboard IDE','USB Controller','USB Legacy','Serial Ports','Parallel Port','Audio AC97','Onboard LAN'],
    'hardware': ['CPU Temperature','CPU Fan','Chassis Fan','Vcore','+3.3V','+5V','+12V','-12V','Battery']
  };

  // === Audio (PC Speaker Beep) ===
  function initBeep(){
    if(!state.beepCtx){
      try{state.beepCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
    }
  }
  function beep(freq,dur){
    initBeep();
    if(!state.beepCtx)return;
    var o=state.beepCtx.createOscillator(),g=state.beepCtx.createGain();
    o.type='square';o.frequency.value=freq;
    g.gain.value=0.1;
    o.connect(g);g.connect(state.beepCtx.destination);
    o.start();
    setTimeout(function(){o.stop()},dur||80);
  }
  function beepKey(){beep(800,40)}
  function beepEnter(){beep(600,80)}
  function beepError(){beep(200,200)}

  // === Toast ===
  function toast(msg,dur){
    dur=dur||1800;
    var c=document.getElementById('toast-container');
    var t=document.createElement('div');
    t.className='toast';
    t.textContent=msg;
    c.appendChild(t);
    requestAnimationFrame(function(){t.style.opacity='1'});
    setTimeout(function(){
      t.style.opacity='0';
      setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t)},250);
    },dur);
  }

  // === Boot Sequence ===
  var bootLines = [
    {t:'Award Modular BIOS v4.51PG', delay:50},
    {t:'Copyright (C) 1984-95, Award Software, Inc.', delay:30},
    {t:'', delay:20},
    {t:'ASUS P2B-F ACPI BIOS Revision 1007', delay:40},
    {t:'', delay:10},
    {t:'Pentium II-MMX CPU at 400MHz', delay:50},
    {t:'Memory Test : ', delay:30, cls:'mem', append:'262144K OK', cls2:'ok'},
    {t:'', delay:10},
    {t:'Award Plug and Play BIOS Extension v1.0A', delay:40},
    {t:'Detecting IDE Primary Master  ... WDC AC31600H', cls:'highlight', delay:60},
    {t:'Detecting IDE Primary Slave   ... None', cls:'highlight', delay:40},
    {t:'Detecting IDE Secondary Master... ATAPI CD-ROM', cls:'highlight', delay:50},
    {t:'Detecting IDE Secondary Slave ... None', cls:'highlight', delay:40},
    {t:'', delay:10},
    {t:'Hold DEL to run Setup', cls:'highlight', delay:40},
    {t:'', delay:30},
    {t:'Starting CMOS Setup Utility...', cls:'highlight', delay:100}
  ];

  function runBoot(){
    var screen=document.getElementById('boot-screen');
    var bios=document.getElementById('bios');
    var lineIdx=0;
    bios.style.display='none';

    function addLine(){
      if(lineIdx>=bootLines.length){
        setTimeout(function(){
          screen.style.opacity='0';
          setTimeout(function(){
            screen.style.display='none';
            bios.style.display='flex';
            state.memTestDone=true;
            beep(1000,100);
            toast('CMOS Setup Utility Ready — Press DEL for setup',2500);
            renderMenu();
            renderDetail();
          },600);
        },400);
        return;
      }
      var l=bootLines[lineIdx];
      var div=document.createElement('div');
      div.className='boot-line';
      if(l.cls)div.classList.add(l.cls);
      div.textContent=l.t;
      if(l.append){
        var span=document.createElement('span');
        if(l.cls2)span.className=l.cls2;
        span.textContent=l.append;
        div.appendChild(span);
      }
      screen.appendChild(div);
      lineIdx++;
      setTimeout(addLine,l.delay||30);
    }
    addLine();
  }

  // === Render Menu ===
  function renderMenu(){
    var list=document.getElementById('menu-list');
    var items=tabItems[state.currentTab]||[];
    list.innerHTML='';
    items.forEach(function(item,i){
      var div=document.createElement('div');
      div.className='bios-menu-item'+(i===state.selectedItem?' active':'');
      div.innerHTML='<span>'+(i===state.selectedItem?'► ':'  ')+item+'</span><span class="arrow">►</span>';
      div.addEventListener('click',function(){
        beepKey();
        state.selectedItem=i;
        renderMenu();
        renderDetail();
      });
      list.appendChild(div);
    });
  }

  // === Render Detail based on selected menu item ===
  function renderDetail(){
    var body=document.getElementById('detail-body');
    var header=document.getElementById('detail-header');
    var tab=state.currentTab;
    var sel=state.selectedItem;

    // Update header
    header.textContent='╔════ '+tabNames[tab]+' ════╗';

    body.innerHTML='';

    // Build content based on tab + selection
    if(tab==='standard-cmos'){
      if(sel===0) renderDateTime(body);
      else if(sel===1) renderHardDisks(body);
      else if(sel===2) renderFloppyDisplay(body);
      else if(sel===3) renderBootSeq(body);
      else if(sel===4) renderMemory(body);
      else renderSystemSummary(body);
    }
    else if(tab==='bios-features'){
      renderBiosFeatures(body,sel);
    }
    else if(tab==='chipset'){
      renderChipset(body,sel);
    }
    else if(tab==='power-mgmt'){
      renderPowerMgmt(body,sel);
    }
    else if(tab==='pnp-pci'){
      renderPnpPci(body,sel);
    }
    else if(tab==='integrated'){
      renderIntegrated(body,sel);
    }
    else if(tab==='hardware'){
      renderHardware(body,sel);
    }
  }

  // === Detail Renderers ===
  function makeRow(label,val,key){
    var row=document.createElement('div');
    row.className='field-row';
    var lab=document.createElement('span');
    lab.className='field-label';
    lab.textContent=label;
    var input=document.createElement('input');
    input.className='field-value';
    input.value=val;
    input.readOnly=true;
    input.addEventListener('dblclick',function(){
      this.readOnly=false;
      this.focus();
      this.select();
      beepEnter();
    });
    input.addEventListener('keydown',function(e){
      if(e.key==='Enter'){
        this.readOnly=true;
        state.modified=true;
        toast('✓ '+label+' changed',1000);
        beepEnter();
      }
      if(e.key==='Escape'){this.readOnly=true;this.value=val}
    });
    input.addEventListener('blur',function(){this.readOnly=true});
    row.appendChild(lab);
    row.appendChild(input);
    return row;
  }

  function makeSelect(label,val,key,opts){
    var row=document.createElement('div');
    row.className='field-row';
    var lab=document.createElement('span');
    lab.className='field-label';
    lab.textContent=label;
    var sel=document.createElement('select');
    sel.className='field-value select';
    opts.forEach(function(o){
      var opt=document.createElement('option');
      opt.value=o;opt.textContent=o;
      if(o===val)opt.selected=true;
      sel.appendChild(opt);
    });
    sel.addEventListener('change',function(){
      state.fields[key].value=this.value;
      state.modified=true;
      toast('✓ '+label+' → '+this.value,1000);
      beepEnter();
    });
    row.appendChild(lab);
    row.appendChild(sel);
    return row;
  }

  function renderDateTime(body){
    body.innerHTML='<div style="font-weight:bold;color:var(--primary);margin-bottom:8px">► Date & Time Configuration</div>';
    body.appendChild(makeRow('Date (mm/dd/yyyy)',state.fields.sysDate,'sysDate'));
    body.appendChild(makeRow('Time (hh:mm:ss)','14:32:08','sysTime'));
    // RTC clock
    var div=document.createElement('div');
    div.style.cssText='margin-top:8px;font-size:10px;color:var(--text-dim)';
    div.textContent='RTC Clock is running — edit fields, then press Enter to commit.';
    body.appendChild(div);
  }

  function renderHardDisks(body){
    body.innerHTML='<div style="font-weight:bold;color:var(--primary);margin-bottom:8px">► IDE Hard Disk Drives</div>';
    body.appendChild(makeRow('Primary Master Type','USER (Auto)',''));
    body.appendChild(makeRow('Primary Master Size','1,621 MB',''));
    body.appendChild(makeRow('Primary Master Cylinders','3,206',''));
    body.appendChild(makeRow('Primary Master Heads','16',''));
    body.appendChild(makeRow('Primary Master Sectors','63',''));
    body.appendChild(makeRow('Primary Master Mode','LBA',''));
    body.appendChild(makeRow('Primary Slave','None',''));
    body.appendChild(makeRow('Secondary Master','CD-ROM (ATAPI)',''));
    body.appendChild(makeRow('Secondary Slave','None',''));
  }

  function renderFloppyDisplay(body){
    body.innerHTML='<div style="font-weight:bold;color:var(--primary);margin-bottom:8px">► Floppy & Display Configuration</div>';
    body.appendChild(makeSelect('Drive A','1.44M 3.5"','floppyA',state.fields.floppyA.opts));
    body.appendChild(makeSelect('Drive B','None','floppyB',state.fields.floppyB.opts));
    body.appendChild(makeSelect('Floppy 3 Mode Support','Disabled','swapFloppy',['Disabled','Drive A','Drive B']));
    body.appendChild(makeSelect('Video Display','EGA/VGA','video',state.fields.video.opts));
    body.appendChild(makeSelect('Halt On Errors','All Errors','haltOn',state.fields.haltOn.opts));
  }

  function renderBootSeq(body){

  }

  function renderMemory(body){
    body.innerHTML='<div style="font-weight:bold;color:var(--primary);margin-bottom:8px">► Memory Diagnostics</div>';
    var mems=[
      {label:'Base Memory',val:'640 KB',pct:4},
      {label:'Extended Memory',val:'255,360 KB',pct:96},
      {label:'Other Memory',val:'384 KB',pct:0}
    ];
    mems.forEach(function(m){
      var row=document.createElement('div');
      row.className='field-row';
      var lab=document.createElement('span');
      lab.className='field-label';
      lab.textContent=m.label;
      var barWrap=document.createElement('div');
      barWrap.className='mem-bar-wrap';
      var fill=document.createElement('div');
      fill.className='mem-bar-fill';
      fill.style.width=m.pct+'%';
      if(m.pct===0)fill.style.display='none';
      var lbl=document.createElement('div');
      lbl.className='mem-bar-label';
      lbl.textContent=m.val;
      barWrap.appendChild(fill);barWrap.appendChild(lbl);
      row.appendChild(lab);
      row.appendChild(barWrap);
      body.appendChild(row);
    });
    var total=document.createElement('div');
    total.style.cssText='margin-top:10px;padding:6px;border:2px solid var(--secondary);background:var(--bg);text-align:center;font-weight:bold;color:var(--secondary)';
    total.textContent='TOTAL SYSTEM MEMORY: 262,144 KB (256 MB)';
    body.appendChild(total);
    var post=document.createElement('div');
    post.style.cssText='margin-top:8px;font-size:10px;color:var(--text-dim)';
    post.innerHTML='POST Memory Map: 640K Base | 384K Reserved | 255,360K Extended<br/>[████████████████████░░░░░░░░░░░░░░░░░░░░]';
    body.appendChild(post);
  }

  function renderSystemSummary(body){

    body.appendChild(makeRow('CPU Speed','400 MHz',''));
    body.appendChild(makeRow('BIOS Version','4.51PG 1007',''));
    body.appendChild(makeRow('BIOS ID','2A59CF0C',''));
    body.appendChild(makeRow('Serial Number','9509021337',''));
    body.appendChild(makeRow('Asset Tag','MACROHARD-001',''));
    body.appendChild(makeRow('Total Memory','262,144 KB',''));
    body.appendChild(makeRow('Cache Size','512 KB',''));
    body.appendChild(makeRow('System Date',state.fields.sysDate,''));

  }

  function renderBiosFeatures(body,sel){
    body.innerHTML='<div style="font-weight:bold;color:var(--primary);margin-bottom:8px">► BIOS Features</div>';
    var feats=[
      {label:'Quick Power On Self Test',key:'QuickPOST'},
      {label:'Boot Sequence',key:'bootSeq'},
      {label:'Boot Up Floppy Seek',key:'bootSeek'},
      {label:'Boot Up NumLock',key:'numLock'},
      {label:'Typematic Rate Setting',key:'typematic'},
      {label:'Supervisor Password',key:'password'},
      {label:'Video BIOS Shadow',key:'shadow'},
      {label:'System BIOS Cacheable',key:'cache'},
      {label:'Cache ECC Checking',key:'cacheECC'},
      {label:'Virus Warning',key:'virusWarn'},
      {label:'OS/2 for >64MB',key:'bootOS2'},
      {label:'Turbo Function',key:'turbo'}
    ];
    feats.forEach(function(f){
      var val=state.fields[f.key];
      if(val&&val.opts){
        body.appendChild(makeSelect(f.label,val.value,f.key,val.opts));
      } else {
        body.appendChild(makeRow(f.label,'Enabled',''));
      }
    });
  }

    body.innerHTML='<div style="font-weight:bold;color:var(--primary);margin-bottom:8px">► Hardware Monitor</div>';
    body.appendChild(makeRow('CPU Temperature','42 °C / 107 °F',''));
    body.appendChild(makeRow('System Temperature','35 °C / 95 °F',''));
    body.appendChild(makeRow('CPU Fan Speed','5430 RPM',''));
    body.appendChild(makeRow('Chassis Fan','N/A',''));
    body.appendChild(makeRow('Vcore Voltage','2.05V',''));
    body.appendChild(makeRow('+3.3V Voltage','3.31V',''));
    body.appendChild(makeRow('+5V Voltage','4.98V',''));
    body.appendChild(makeRow('+12V Voltage','11.89V',''));
    body.appendChild(makeRow('-12V Voltage','-11.76V',''));
    body.appendChild(makeRow('Battery Voltage','3.12V',''));
    var note=document.createElement('div');
    note.style.cssText='margin-top:8px;padding:6px;border:2px solid var(--error);color:var(--error);font-size:10px';
    note.textContent='⚠ WARNING: Values may not reflect actual hardware. Virtual sensors active.';
    body.appendChild(note);
  }

  // === Keyboard Nav ===
  document.addEventListener('keydown',function(e){
    var tab=state.currentTab;
    var items=tabItems[tab]||[];
    switch(e.key){
      case 'ArrowUp':
        e.preventDefault();
        if(state.selectedItem>0){state.selectedItem--;renderMenu();renderDetail();beepKey()}
        break;
      case 'ArrowDown':
        e.preventDefault();
        if(state.selectedItem<items.length-1){state.selectedItem++;renderMenu();renderDetail();beepKey()}
        break;
      case 'Enter':
      case ' ':
        beepEnter();
        break;
      case 'Escape':
        beepError();
        toast('Exiting setup — changes '+(state.modified?'NOT saved':'discarded'),2000);
        break;
      case 'F10':
        e.preventDefault();
        beepEnter();
        toast('✓ Setup saved — system resetting...',2000);
        state.modified=false;
        setTimeout(function(){
          toast('Rebooting...',1500);
          setTimeout(function(){location.reload()},2000);
        },1500);
        break;
      case 'F5':
        e.preventDefault();beepKey();toast('Loaded previous CMOS values',1500);state.modified=true;
        break;
      case 'F6':
        e.preventDefault();beepKey();toast('Loaded BIOS defaults',1500);state.modified=true;
        break;
      case 'F7':
        e.preventDefault();beepKey();toast('Loaded setup defaults',1500);state.modified=true;
        break;
      case 'F1':
        e.preventDefault();toast('Help: Use arrow keys to navigate, +/- to change values',3000);
        break;
    }
  });

  // === Tab Cycle (Shift+Tab to switch main tabs) ===
  var tabOrder=['standard-cmos','bios-features','chipset','power-mgmt','pnp-pci','integrated','hardware'];
  document.addEventListener('keydown',function(e){
    if(e.key==='Tab'){
      e.preventDefault();
      var curIdx=tabOrder.indexOf(state.currentTab);
      var next=(e.shiftKey?curIdx-1+tabOrder.length:curIdx+1)%tabOrder.length;
      state.currentTab=tabOrder[next];
      state.selectedItem=0;
      renderMenu();renderDetail();beepKey();
    }
  });

  // === Init ===
  runBoot();
})();
</script>
</body>
</html>
