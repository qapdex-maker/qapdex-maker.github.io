<!--
  Quelle fuer favicon.ico / apple-touch-icon.png / icon-192.png / icon-512.png.
  Bewusst als SVG im Repo: eine .ico ist ein Container, den man nicht mehr
  sinnvoll diffen kann, und die PNG-Groessen sind daraus eindeutig ableitbar.
  Der 404 im Serverlog kam daher, dass der Browser /favicon.ico anfragt und
  es keine Datei gab — nicht weil eines kaputt war.

  Motiv (29.09.2026): ein MakerOS-Fenster — Rahmen, blaue Kopfleiste, drei
  gelbe Kontrollquadrate, zwei Inhaltszeilen. Es ersetzt die vier orangen
  Kacheln, die bei 16px zu einem undeutlichen Block zusammenflossen und
  nichts erkennbar machten.

  Gemessen in Chromium und per Pixelvergleich: bei 16px bleiben Silhouette
  und Farbzonen erhalten, die Inhaltszeilen verschwinden erwartungsgemaess
  zuerst. Fuer 32px und groesser ist das Motiv eindeutig.

  Erzeugt mit:
    rsvg-convert -w N -h N assets/icon-source.svg -o <ziel>
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" fill="#f1ede3"/>
  <g>
    <rect x="6" y="14" width="116" height="100" fill="#ffffff"/>
    <rect x="6" y="14" width="116" height="100" fill="none" stroke="#0b0b0c" stroke-width="12"/>
    <rect x="6" y="14" width="116" height="30" fill="#2547ff"/>
    <rect x="6" y="38" width="116" height="12" fill="#0b0b0c"/>
    <rect x="18" y="19" width="18" height="18" fill="#ffd400"/>
    <rect x="46" y="19" width="18" height="18" fill="#ffd400"/>
    <rect x="74" y="19" width="18" height="18" fill="#ffd400"/>
    <rect x="18" y="62" width="92" height="12" fill="#0b0b0c"/>
    <rect x="18" y="84" width="58" height="12" fill="#0b0b0c"/>
  </g>
</svg>
